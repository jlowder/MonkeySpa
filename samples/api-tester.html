<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23161b22'/%3E%3Cpath d='M10 20 L22 10 L22 30 L34 20' stroke='%2358a6ff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Palette */
            --ink: #0d1117;
            --stone: #161b22;
            --fog: #21262d;
            --frost: #8b949e;
            --polar: #c9d1d9;
            --arctic: #f0f6fc;
            
            /* Accents */
            --signal: #3b82f6;
            --signal-dim: rgba(59, 130, 246, 0.15);
            
            /* Semantic */
            --success: #238636;
            --warning: #d29922;
            --error: #da3633;
            
            /* Method colors */
            --method-get: #58a6ff;
            --method-post: #238636;
            --method-put: #d29922;
            --method-delete: #da3633;
            --method-patch: #8957e5;
            
            /* Type */
            --font-interface: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-code: 'IBM Plex Mono', 'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace;
            
            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            
            /* Borders */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-normal: 250ms ease;
        }

        [data-theme="light"] {
            --ink: #ffffff;
            --stone: #f6f8fa;
            --fog: #ebf0f4;
            --frost: #656d76;
            --polar: #24292f;
            --arctic: #0d1117;
            --signal-dim: rgba(59, 130, 246, 0.1);
        }

        /* Reset */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-interface);
            font-size: 14px;
            background: var(--ink);
            color: var(--polar);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--stone);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--fog);
            border: 2px solid var(--stone);
            border-radius: 6px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--frost);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-lg);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--fog);
        }

        .header-title {
            font-family: var(--font-code);
            font-size: 18px;
            font-weight: 600;
            color: var(--arctic);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .header-title .icon {
            width: 24px;
            height: 24px;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--fog);
            background: var(--stone);
            color: var(--frost);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .theme-toggle:hover {
            border-color: var(--signal);
            color: var(--signal);
        }

        /* URL Hero */
        .url-hero {
            margin-bottom: var(--space-lg);
        }

        .url-bar {
            display: flex;
            align-items: stretch;
            background: var(--stone);
            border: 1px solid var(--fog);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition-fast);
        }

        .url-bar:focus-within {
            border-color: var(--signal);
            box-shadow: 0 0 0 3px var(--signal-dim);
        }

        .method-select {
            appearance: none;
            border: none;
            border-right: 1px solid var(--fog);
            background: var(--fog);
            color: var(--arctic);
            font-family: var(--font-code);
            font-size: 14px;
            font-weight: 600;
            padding: var(--space-sm) var(--space-md);
            cursor: pointer;
            min-width: 100px;
            text-align: center;
            transition: var(--transition-fast);
        }

        .method-select:hover {
            background: var(--frost);
        }

        .method-select option {
            background: var(--stone);
            color: var(--arctic);
            font-weight: 600;
        }

        .url-input {
            flex: 1;
            appearance: none;
            border: none;
            background: transparent;
            color: var(--arctic);
            font-family: var(--font-code);
            font-size: 16px;
            padding: var(--space-md);
        }

        .url-input::placeholder {
            color: var(--frost);
            opacity: 0.6;
        }

        .url-input:focus {
            outline: none;
        }

        .url-actions {
            display: flex;
        }

        .btn {
            font-family: var(--font-interface);
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-xs);
        }

        .btn-icon {
            width: 36px;
        }

        .btn-primary {
            background: var(--signal);
            color: white;
            padding: 0 var(--space-lg);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2563eb;
        }

        .btn-secondary {
            background: var(--fog);
            color: var(--polar);
            padding: 0 var(--space-md);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            border-left: 1px solid var(--stone);
        }

        .btn-secondary.btn-icon {
            padding: 0 var(--space-sm);
        }

        .btn-secondary:hover {
            background: var(--frost);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn .icon {
            width: 16px;
            height: 16px;
        }

        .btn-icon .icon {
            width: 18px;
            height: 18px;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
            margin-bottom: var(--space-lg);
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--stone);
            border: 1px solid var(--fog);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-md) var(--space-lg);
            background: var(--fog);
            border-bottom: 1px solid var(--fog);
        }

        .card-title {
            font-family: var(--font-code);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--frost);
        }

        /* Status Badge in Card */
        .status-badge {
            font-family: var(--font-code);
            font-size: 12px;
            font-weight: 600;
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-sm);
            background: var(--stone);
        }

        .status-badge.ok {
            color: var(--success);
            background: rgba(35, 134, 54, 0.15);
        }

        .status-badge.error {
            color: var(--error);
            background: rgba(218, 54, 51, 0.15);
        }

        /* Tabs */
        .tabs {
            display: flex;
            padding: 0 var(--space-lg);
            background: var(--stone);
            border-bottom: 1px solid var(--fog);
            gap: var(--space-xs);
        }

        .tab {
            padding: var(--space-md) var(--space-sm);
            font-family: var(--font-interface);
            font-size: 13px;
            font-weight: 500;
            color: var(--frost);
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            transition: var(--transition-fast);
        }

        .tab:hover {
            color: var(--polar);
        }

        .tab.active {
            color: var(--signal);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: calc(-1px - var(--space-lg));
            left: 0;
            right: 0;
            height: 2px;
            background: var(--signal);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Request Body */
        .request-body {
            padding: var(--space-lg);
        }

        .body-textarea {
            width: 100%;
            min-height: 200px;
            background: var(--ink);
            color: var(--polar);
            border: 1px solid var(--fog);
            border-radius: var(--radius-sm);
            padding: var(--space-md);
            font-family: var(--font-code);
            font-size: 14px;
            resize: vertical;
            line-height: 1.6;
        }

        .body-textarea:focus {
            outline: none;
            border-color: var(--signal);
        }

        .body-textarea::placeholder {
            color: var(--frost);
            opacity: 0.5;
        }

        .body-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: var(--space-sm);
        }

        .btn-tertiary {
            font-family: var(--font-interface);
            font-size: 12px;
            color: var(--frost);
            background: none;
            border: none;
            cursor: pointer;
            padding: var(--space-xs) var(--space-sm);
            transition: var(--transition-fast);
        }

        .btn-tertiary:hover {
            color: var(--signal);
        }

        /* Headers Editor */
        .headers-editor {
            padding: var(--space-lg);
        }

        .header-row {
            display: flex;
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
            align-items: center;
        }

        .header-row input {
            flex: 1;
            background: var(--ink);
            color: var(--polar);
            border: 1px solid var(--fog);
            border-radius: var(--radius-sm);
            padding: var(--space-sm) var(--space-md);
            font-family: var(--font-code);
            font-size: 13px;
        }

        .header-row input:focus {
            outline: none;
            border-color: var(--signal);
        }

        .header-row input::placeholder {
            color: var(--frost);
            opacity: 0.5;
        }

        .btn-remove {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--stone);
            color: var(--frost);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .btn-remove:hover {
            background: var(--error);
            color: white;
        }

        .btn-add {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            margin-top: var(--space-sm);
            border: 1px dashed var(--frost);
            border-radius: var(--radius-sm);
            background: none;
            color: var(--frost);
            font-family: var(--font-interface);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-add:hover {
            border-color: var(--signal);
            color: var(--signal);
            background: var(--signal-dim);
        }

        /* Response */
        .response-meta {
            display: flex;
            gap: var(--space-md);
            padding: var(--space-sm) var(--space-lg);
            font-size: 12px;
            color: var(--frost);
            background: var(--stone);
            border-bottom: 1px solid var(--fog);
        }

        .response-meta .item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .response-meta .item .icon {
            width: 12px;
            height: 12px;
        }

        .response-body {
            padding: var(--space-lg);
            background: var(--ink);
            min-height: 200px;
        }

        .response-container {
            background: var(--stone);
            border: 1px solid var(--fog);
            border-radius: var(--radius-sm);
            padding: var(--space-md);
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.6;
            overflow: auto;
            max-height: 400px;
            position: relative;
        }

        .response-container.streaming {
            border-color: var(--warning);
        }

        .btn-copy {
            position: absolute;
            top: var(--space-sm);
            right: var(--space-sm);
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--fog);
            color: var(--polar);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .btn-copy:hover {
            background: var(--signal);
            color: white;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* JSON Syntax Highlighting */
        .json-key { color: #7ee787; }
        .json-string { color: #a5d6ff; }
        .json-number { color: #79c0ff; }
        .json-boolean { color: #d2a8ff; }
        .json-null { color: #90b2f4; }

        [data-theme="light"] .json-key { color: #0969da; }
        [data-theme="light"] .json-string { color: #0969da; }
        [data-theme="light"] .json-number { color: #0969da; }
        [data-theme="light"] .json-boolean { color: #8957e5; }
        [data-theme="light"] .json-null { color: #8250df; }

        /* Status Ribbon */
        .status-ribbon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-md);
            padding: var(--space-md) var(--space-lg);
            background: var(--stone);
            border: 1px solid var(--fog);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-lg);
            font-family: var(--font-code);
            font-size: 13px;
            transition: var(--transition-normal);
        }

        .status-ribbon.ready {
            border-color: var(--frost);
        }

        .status-ribbon.active {
            border-color: var(--signal);
            box-shadow: 0 0 0 3px var(--signal-dim);
        }

        .status-ribbon .method {
            font-weight: 700;
            color: var(--signal);
        }

        .status-ribbon .arrow {
            color: var(--frost);
            font-size: 16px;
        }

        .status-ribbon .status {
            font-weight: 600;
        }

        .status-ribbon .status.ok { color: var(--success); }
        .status-ribbon .status.error { color: var(--error); }

        .status-ribbon .time {
            color: var(--frost);
        }

        .status-ribbon .size {
            color: var(--frost);
        }

        /* History Section */
        .history-section {
            background: var(--stone);
            border: 1px solid var(--fog);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md) var(--space-lg);
            background: var(--fog);
            border-bottom: 1px solid var(--fog);
        }

        .history-title {
            font-family: var(--font-code);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--frost);
        }

        .btn-clear {
            font-family: var(--font-interface);
            font-size: 12px;
            color: var(--frost);
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-clear:hover {
            color: var(--polar);
        }

        .history-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-sm) var(--space-lg);
            cursor: pointer;
            transition: var(--transition-fast);
            border-bottom: 1px solid transparent;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: var(--fog);
            border-bottom-color: var(--fog);
        }

        .history-method {
            font-family: var(--font-code);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            min-width: 50px;
            text-align: center;
            color: white;
        }

        .history-method.GET { background: var(--method-get); }
        .history-method.POST { background: var(--method-post); }
        .history-method.PUT { background: var(--method-put); }
        .history-method.DELETE { background: var(--method-delete); }
        .history-method.PATCH { background: var(--method-patch); }

        .history-url {
            flex: 1;
            font-family: var(--font-code);
            font-size: 13px;
            color: var(--polar);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-time {
            font-size: 12px;
            color: var(--frost);
        }

        .history-empty {
            padding: var(--space-xl);
            text-align: center;
            color: var(--frost);
        }

        /* Streaming indicator */
        .streaming-dot {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            color: var(--warning);
            font-size: 12px;
            font-weight: 500;
        }

        .streaming-dot .dot {
            width: 8px;
            height: 8px;
            background: var(--warning);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn var(--transition-normal) ease;
        }

        /* Icons */
        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* CORS Warning Banner */
        .cors-banner {
            display: flex;
            align-items: flex-start;
            gap: var(--space-sm);
            margin-top: var(--space-md);
            padding: var(--space-sm) var(--space-md);
            background: rgba(210, 153, 34, 0.1);
            border: 1px solid rgba(210, 153, 34, 0.4);
            border-radius: var(--radius-md);
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn var(--transition-normal) ease;
        }

        [data-theme="light"] .cors-banner {
            background: rgba(210, 153, 34, 0.15);
            border-color: rgba(210, 153, 34, 0.6);
        }

        .cors-banner .banner-icon {
            width: 16px;
            height: 16px;
            color: var(--warning);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .cors-banner .banner-text {
            flex: 1;
            color: var(--polar);
        }

        .cors-banner .banner-line {
            display: block;
        }

        .cors-banner .banner-line-sub {
            color: var(--frost);
        }

        .cors-banner .banner-close {
            flex-shrink: 0;
            margin-left: var(--space-xs);
            background: none;
            border: none;
            color: var(--frost);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .cors-banner .banner-close:hover {
            color: var(--polar);
        }

        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 12v-2a8 8 0 0 1 8-8 8 8 0 0 1 8 8v2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 20a8 8 0 0 0 8-8h-8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 20a8 8 0 0 1-8-8h8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                API Tester
            </h1>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                <span class="icon theme-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </button>
        </header>

        <!-- URL Hero -->
        <div class="url-hero">
            <div class="url-bar">
                <select class="method-select" id="method">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                </select>
                <input type="text" class="url-input" id="url" placeholder="https://api.example.com/endpoint" value="https://jsonplaceholder.typicode.com/posts/1">
                <div class="url-actions">
                    <button class="btn btn-primary" onclick="handleModeClick('send')" id="btn-send">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span id="send-btn-text">SEND</span>
                    </button>
                    <button class="btn btn-secondary" onclick="handleModeClick('stream')" id="btn-stream">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v4m0 12v4M2 12h4m12 0h4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span id="stream-btn-text">STREAM</span>
                    </button>
                </div>
            </div>
            <!-- Cross-origin (CORS) warning banner -->
            <div class="cors-banner hidden" id="cors-banner" role="alert">
                <span class="icon banner-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="12" y1="9" x2="12" y2="13" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="12" y1="17" x2="12.01" y2="17" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <div class="banner-text" id="cors-banner-text"></div>
                <button class="banner-close" id="cors-banner-close" aria-label="Dismiss warning">&times;</button>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Request Card -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Request</span>
                    <span id="req-status" class="status-badge hidden"></span>
                </div>
                
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('request', 'req-body-tab', this)">Body</button>
                    <button class="tab" onclick="switchTab('request', 'req-headers-tab', this)">Headers</button>
                </div>

                <div id="req-body-tab" class="tab-content active">
                    <div class="request-body">
                        <textarea class="body-textarea" id="body" placeholder='{"key": "value"}'></textarea>
                        <div class="body-actions">
                            <button class="btn-tertiary" onclick="beautifyJSON()">Format JSON</button>
                        </div>
                    </div>
                </div>

                <div id="req-headers-tab" class="tab-content">
                    <div class="headers-editor" id="headers-list">
                        <!-- Header rows inserted here -->
                    </div>
                    <div style="padding: 0 var(--space-lg) var(--space-lg)">
                        <button class="btn-add" onclick="addHeaderRow()">
                            + Add Header
                        </button>
                    </div>
                </div>
            </div>

            <!-- Response Card -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Response</span>
                    <span id="res-status" class="status-badge hidden"></span>
                </div>

                <div class="response-meta">
                    <span class="item" id="res-time">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span>-- ms</span>
                    </span>
                    <span class="item" id="res-size">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke-linecap="round" stroke-linejoin="round"/>
                                <polyline points="17 8 12 3 7 8" stroke-linecap="round" stroke-linejoin="round"/>
                                <line x1="12" y1="3" x2="12" y2="15" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span>-- KB</span>
                    </span>
                </div>

                <div class="tabs">
                    <button class="tab active" onclick="switchTab('response', 'res-body-tab', this)">Body</button>
                    <button class="tab" onclick="switchTab('response', 'res-headers-tab', this)">Headers</button>
                    <button class="tab" onclick="switchTab('response', 'res-raw-tab', this)">Raw</button>
                </div>

                <div id="res-body-tab" class="tab-content active">
                    <div class="response-body">
                        <div class="response-container" id="response-container">
                            <button class="btn-copy" onclick="copyResponse()" aria-label="Copy response">
                                <span class="icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                            </button>
                            <pre id="response-content"><span style="color: var(--frost)"><span class="streaming-dot"><span class="dot"></span> Ready</span></span></pre>
                        </div>
                    </div>
                </div>

                <div id="res-headers-tab" class="tab-content">
                    <div class="response-body">
                        <div class="response-container">
                            <pre id="response-headers">--</pre>
                        </div>
                    </div>
                </div>

                <div id="res-raw-tab" class="tab-content">
                    <div class="response-body">
                        <div class="response-container">
                            <pre id="response-raw">--</pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Ribbon -->
        <div class="status-ribbon" id="status-ribbon">
            <span class="method" id="ribbon-method">&#8594;</span>
            <span class="status" id="ribbon-status">Ready</span>
            <span class="time" id="ribbon-time"></span>
            <span class="size" id="ribbon-size"></span>
        </div>

        <!-- History Section -->
        <section class="history-section">
            <div class="history-header">
                <span class="history-title">Request History</span>
                <button class="btn-clear" onclick="clearHistory()">Clear all</button>
            </div>
            <ul class="history-list" id="main-history-list">
                <!-- History items here -->
            </ul>
        </section>
    </div>

    <script>
        // State
        let history = [];
        try {
            history = JSON.parse(localStorage.getItem('api_history') || '[]');
        } catch (e) {
            console.error('Failed to parse API history:', e);
        }
        
        let currentTheme = localStorage.getItem('api_theme') || 'dark';
        document.body.setAttribute('data-theme', currentTheme);
        updateThemeIcon();
        
        let isStreaming = false;
        let abortController = null;
        let responseReader = null;
        let currentMode = 'send';
        let requestStartTime = 0;

        // Initialize with default header
        addHeaderRow('Content-Type', 'application/json');
        renderHistory();

        // Cross-origin (CORS) banner state
        let corsDismissed = false;
        let corsCheckTimer = null;

        // One helper reused by the banner, the error diagnostics, and the
        // response-headers note. Unparseable / relative / non-http(s) URLs are
        // treated as not cross-origin. file:// pages have origin "null".
        function getCorsInfo(url) {
            const info = { isCrossOrigin: false, isFilePage: false, targetOrigin: null, pageOrigin: null };
            let parsed;
            try {
                parsed = new URL(url);
            } catch (e) {
                return info;
            }
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                return info;
            }
            info.targetOrigin = parsed.origin;
            info.isFilePage = location.protocol === 'file:';
            info.pageOrigin = (location.protocol === 'file:' || location.origin === 'null') ? 'null' : location.origin;
            info.isCrossOrigin = info.targetOrigin !== info.pageOrigin;
            return info;
        }

        function updateCorsBanner() {
            const banner = document.getElementById('cors-banner');
            const textEl = document.getElementById('cors-banner-text');
            const info = getCorsInfo(document.getElementById('url').value.trim());

            if (!info.isCrossOrigin) {
                corsDismissed = false; // reset so a later cross-origin URL re-shows it
                banner.classList.add('hidden');
                return;
            }
            if (corsDismissed) {
                banner.classList.add('hidden');
                return;
            }

            // Static strings only — textContent, never innerHTML with user data.
            textEl.innerHTML = '';
            const line1 = document.createElement('span');
            line1.className = 'banner-line';
            line1.textContent = 'Cross-origin request — the target server must send CORS headers (Access-Control-Allow-Origin) and handle preflight (OPTIONS) for non-simple requests, or the browser will block the response.';
            textEl.appendChild(line1);
            if (info.isFilePage) {
                const line2 = document.createElement('span');
                line2.className = 'banner-line banner-line-sub';
                line2.textContent = 'You are running from file://, so the browser sends Origin: null — the server must use a wildcard (*) origin; an origin allowlist will not match.';
                textEl.appendChild(line2);
            }
            banner.classList.remove('hidden');
        }

        document.getElementById('url').addEventListener('input', function() {
            if (corsCheckTimer) clearTimeout(corsCheckTimer);
            corsCheckTimer = setTimeout(updateCorsBanner, 300);
        });
        document.getElementById('cors-banner-close').addEventListener('click', function() {
            corsDismissed = true;
            document.getElementById('cors-banner').classList.add('hidden');
        });
        updateCorsBanner();

        // Theme Toggle
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', currentTheme);
            localStorage.setItem('api_theme', currentTheme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const iconContainer = document.querySelector('.theme-icon');
            if (currentTheme === 'light') {
                iconContainer.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>`;
            } else {
                iconContainer.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>`;
            }
        }

        // Tab switching
        function switchTab(group, tabId, el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            const container = parent.parentElement;
            container.querySelectorAll('.tab-content').forEach(c => {
                c.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
        }

        // Headers
        function addHeaderRow(key = '', value = '') {
            const list = document.getElementById('headers-list');
            const row = document.createElement('div');
            row.className = 'header-row';
            row.innerHTML = `
                <input type="text" placeholder="Key" value="${key}" ${key ? 'aria-value="' + key + '"' : ''}>
                <input type="text" placeholder="Value" value="${value}" ${value ? 'aria-value="' + value + '"' : ''}>
                <button class="btn-remove" aria-label="Remove header">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            `;
            row.querySelector('.btn-remove').addEventListener('click', function() {
                row.remove();
            });
            list.appendChild(row);
        }

        // Body formatting
        function beautifyJSON() {
            const textarea = document.getElementById('body');
            try {
                const obj = JSON.parse(textarea.value);
                textarea.value = JSON.stringify(obj, null, 2);
            } catch(e) {
                // Simple visual feedback
                textarea.style.borderColor = 'var(--error)';
                setTimeout(() => textarea.style.borderColor = '', 500);
            }
        }

        // Mode handling
        function handleModeClick(mode) {
            if (isStreaming && currentMode === mode) {
                stopStreaming();
            } else {
                currentMode = mode;
                sendRequest();
            }
        }

        function stopStreaming() {
            isStreaming = false;
            
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            
            if (responseReader) {
                responseReader.cancel().catch(() => {});
                responseReader = null;
            }
            
            const sendBtn = document.getElementById('btn-send');
            const streamBtn = document.getElementById('btn-stream');
            
            sendBtn.disabled = false;
            document.getElementById('send-btn-text').textContent = 'SEND';
            streamBtn.disabled = false;
            document.getElementById('stream-btn-text').textContent = 'STREAM';
            
            // Update status
            const statusBadge = document.getElementById('res-status');
            statusBadge.className = 'status-badge error';
            statusBadge.textContent = 'Stopped';
            
            // Update ribbon
            updateRibbon(null, 'Stopped', 0, 0, true);
            
            const contentPre = document.getElementById('response-content');
            const stopIndicator = document.createElement('span');
            stopIndicator.style.color = 'var(--frost)';
            stopIndicator.style.display = 'block';
            stopIndicator.style.marginTop = '8px';
            stopIndicator.textContent = '\n[Streaming stopped]';
            contentPre.appendChild(stopIndicator);
            
            document.getElementById('response-headers').textContent = 'Streaming stopped';
            document.getElementById('response-raw').textContent = '';
        }

        function updateRibbon(method, status, time, size, isError = false) {
            const ribbon = document.getElementById('status-ribbon');
            const methodEl = document.getElementById('ribbon-method');
            const statusEl = document.getElementById('ribbon-status');
            const timeEl = document.getElementById('ribbon-time');
            const sizeEl = document.getElementById('ribbon-size');
            
            if (method) {
                methodEl.textContent = method + ' →';
                methodEl.style.color = getMethodColor(method);
            } else {
                methodEl.textContent = '→';
            }
            
            statusEl.textContent = status;
            statusEl.className = 'status ' + (isError ? 'error' : (status >= 200 && status < 300 ? 'ok' : ''));
            
            timeEl.textContent = time ? `• ${time} ms` : '';
            sizeEl.textContent = size ? `• ${size} KB` : '';
        }

        // Main request handler
        async function sendRequest() {
            const url = document.getElementById('url').value.trim();
            const method = document.getElementById('method').value;
            const bodyText = document.getElementById('body').value;
            
            if (!url) {
                alert('Please enter a URL');
                return;
            }
            
            try {
                new URL(url);
            } catch (e) {
                alert('Invalid URL format. Please include the protocol (e.g., https://).');
                return;
            }

            const sendBtn = document.getElementById('btn-send');
            const streamBtn = document.getElementById('btn-stream');
            sendBtn.disabled = true;
            streamBtn.disabled = true;

            const corsInfo = getCorsInfo(url);
            const hasBody = bodyText.trim().length > 0;
            const headers = {};
            document.querySelectorAll('.header-row').forEach(row => {
                const inputs = row.querySelectorAll('input');
                const name = inputs[0].value.trim();
                const value = inputs[1].value.trim();
                if (!name || !value) return; // skip rows with an empty name or value
                // A Content-Type on a bodyless request is meaningless and forces a
                // CORS preflight that fails on non-CORS servers — skip it.
                if (!hasBody && name.toLowerCase() === 'content-type') return;
                headers[name] = value;
            });

            requestStartTime = performance.now();
            let fullText = '';
            let totalBytes = 0;
            
            try {
                abortController = new AbortController();
                isStreaming = true;
                
                const options = { 
                    method, 
                    headers, 
                    signal: abortController.signal 
                };
                if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method) && hasBody) {
                    options.body = bodyText;
                }

                const response = await fetch(url, options);
                
                // Update status badge
                const resStatusBadge = document.getElementById('res-status');
                resStatusBadge.className = `status-badge ${response.ok ? 'ok' : 'error'}`;
                resStatusBadge.textContent = `${response.status} ${response.statusText}`;
                resStatusBadge.classList.remove('hidden');
                
                // Update ribbon
                updateRibbon(method, `${response.status} ${response.statusText}`, 0, 0, !response.ok);
                
                // Update ribbon state
                const ribbon = document.getElementById('status-ribbon');
                ribbon.classList.remove('ready');
                ribbon.classList.add('active');
                
                // Update buttons
                if (currentMode === 'stream') {
                    isStreaming = true;
                    streamBtn.disabled = false;
                    document.getElementById('stream-btn-text').innerHTML = '<span class="streaming-dot"><span class="dot"></span> STREAMING</span>';
                    sendBtn.disabled = true;
                    document.getElementById('response-content').innerHTML = 
                        '<span style="color: var(--frost)"><span class="streaming-dot"><span class="dot"></span> Streaming response...</span></span>';
                } else {
                    isStreaming = false;
                    sendBtn.disabled = true;
                    document.getElementById('send-btn-text').innerHTML = '<span class="streaming-dot"><span class="dot"></span></span> Loading';
                    streamBtn.disabled = true;
                    document.getElementById('response-content').innerHTML = 
                        '<span style="color: var(--frost)"><span class="streaming-dot"><span class="dot"></span></span> Loading...</span>';
                }
                
                // Clear response areas
                document.getElementById('response-headers').textContent = 'Loading...';
                document.getElementById('response-raw').textContent = '';
                
                // Build response headers text; for cross-origin responses append
                // a note once (the stream/raw render sites reuse this same string).
                let responseHeadersText = '';
                response.headers.forEach((v, k) => responseHeadersText += `${k}: ${v}\n`);
                if (corsInfo.isCrossOrigin) {
                    const note = 'Cross-origin: the browser only exposes response headers the server listed in Access-Control-Expose-Headers.';
                    responseHeadersText = responseHeadersText ? responseHeadersText + '\n' + note : note;
                }
                document.getElementById('response-headers').textContent = responseHeadersText || 'No headers returned';
                
                if (response.body) {
                    if (currentMode === 'stream') {
                        const reader = response.body.getReader();
                        responseReader = reader;
                        const decoder = new TextDecoder();
                        
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                            fullText += decoder.decode(value, { stream: true });
                            totalBytes += value.byteLength;
                            
                            const elapsed = Math.round(performance.now() - requestStartTime);
                            const sizeKB = (totalBytes / 1024).toFixed(2);
                            
                            document.getElementById('res-time').innerHTML = `
                                <span class="icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                                <span>${elapsed} ms</span>`;
                            document.getElementById('res-size').innerHTML = `
                                <span class="icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke-linecap="round" stroke-linejoin="round"/>
                                        <polyline points="17 8 12 3 7 8" stroke-linecap="round" stroke-linejoin="round"/>
                                        <line x1="12" y1="3" x2="12" y2="15" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                                <span>${sizeKB} KB</span>`;
                            
                            updateRibbon(method, `${response.status} ${response.statusText}`, elapsed, sizeKB, !response.ok);
                            
                            document.getElementById('response-content').textContent = fullText;
                            document.getElementById('response-headers').textContent = responseHeadersText || 'No headers returned';
                            document.getElementById('response-raw').textContent = fullText;
                        }
                        
                        // Stream complete
                        streamBtn.disabled = false;
                        document.getElementById('stream-btn-text').textContent = 'STREAM';
                        sendBtn.disabled = false;
                        document.getElementById('send-btn-text').textContent = 'SEND';
                        isStreaming = false;
                    } else {
                        fullText = await response.text();
                        totalBytes = new Blob([fullText]).size;
                        
                        sendBtn.disabled = false;
                        document.getElementById('send-btn-text').textContent = 'SEND';
                        streamBtn.disabled = false;
                        document.getElementById('stream-btn-text').textContent = 'STREAM';
                        isStreaming = false;
                    }
                } else {
                    fullText = await response.text();
                    totalBytes = new Blob([fullText]).size;
                    
                    sendBtn.disabled = false;
                    document.getElementById('send-btn-text').textContent = 'SEND';
                    streamBtn.disabled = false;
                    document.getElementById('stream-btn-text').textContent = 'STREAM';
                    isStreaming = false;
                }

                const endTime = performance.now();
                const duration = Math.round(endTime - requestStartTime);
                const size = (totalBytes / 1024).toFixed(2);

                document.getElementById('res-time').innerHTML = `
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span>${duration} ms</span>`;
                document.getElementById('res-size').innerHTML = `
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="17 8 12 3 7 8" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="12" y1="3" x2="12" y2="15" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span>${size} KB</span>`;

                // Format response body
                try {
                    const json = JSON.parse(fullText);
                    document.getElementById('response-content').innerHTML = highlightJSON(json);
                } catch(e) {
                    document.getElementById('response-content').textContent = fullText;
                }

                document.getElementById('response-headers').textContent = responseHeadersText || 'No headers returned';
                document.getElementById('response-raw').textContent = fullText;
                
                responseReader = null;
                
                // Update ribbon on complete
                updateRibbon(method, `${response.status} ${response.statusText}`, duration, size, !response.ok);
                
                // Add to history
                addToHistory(method, url);
                
                // Remove active state after animation
                setTimeout(() => {
                    document.getElementById('status-ribbon').classList.remove('active');
                    document.getElementById('status-ribbon').classList.add('ready');
                }, 2000);
                
            } catch(e) {
                const endTime = performance.now();
                responseReader = null;
                // Don't leave the ribbon stuck in the "active" state after a
                // failed/aborted request.
                const ribbon = document.getElementById('status-ribbon');
                ribbon.classList.remove('active');
                ribbon.classList.add('ready');
                
                if (e.name === 'AbortError') {
                    isStreaming = false;
                    abortController = null;
                    streamBtn.disabled = false;
                    document.getElementById('stream-btn-text').textContent = 'STREAM';
                    sendBtn.disabled = false;
                    document.getElementById('send-btn-text').textContent = 'SEND';
                } else {
                    const duration = Math.round(endTime - requestStartTime);
                    displayError(e, duration, { url, method });
                    
                    isStreaming = false;
                    abortController = null;
                    sendBtn.disabled = false;
                    document.getElementById('send-btn-text').textContent = 'SEND';
                    streamBtn.disabled = false;
                    document.getElementById('stream-btn-text').textContent = 'STREAM';
                }
            }
        }

        function displayError(err, time, context) {
            const statusBadge = document.getElementById('res-status');
            statusBadge.className = 'status-badge error';
            statusBadge.textContent = 'Error';
            statusBadge.classList.remove('hidden');

            updateRibbon(null, 'Error', time, 0, true);
            
            const content = document.getElementById('response-content');
            content.innerHTML = '';
            
            // A TypeError from fetch is a network/CORS-level failure (not an
            // HTTP status; AbortError is handled before this is called).
            const isNetworkLevel = err instanceof TypeError || err.name === 'TypeError';
            if (isNetworkLevel && context && context.url) {
                const corsInfo = getCorsInfo(context.url);
                if (corsInfo.isCrossOrigin) {
                    appendErrorLine(content, `${context.method} ${context.url} — network/CORS-level failure`, 'var(--error)');
                    appendErrorLine(content, 'The request was sent and the server may have received it — check the server logs.', 'var(--frost)');
                    appendErrorLine(content, 'The browser blocked or discarded the response because the server did not return CORS headers (Access-Control-Allow-Origin), or the preflight OPTIONS request failed.', 'var(--frost)');
                    appendErrorLine(content, 'Fix: the server should send Access-Control-Allow-Origin (or *) on every response, and answer preflight OPTIONS with a 2xx status plus Access-Control-Allow-Methods and Access-Control-Allow-Headers (e.g. Content-Type).', 'var(--frost)');
                    if (corsInfo.isFilePage) {
                        appendErrorLine(content, 'You are running from file://, so the browser sends Origin: null — the server must use a wildcard (*) origin; an origin allowlist will not match.', 'var(--frost)');
                    }
                } else {
                    appendErrorLine(content, `Could not reach ${context.url} — is the server running?`, 'var(--error)');
                }
                appendErrorLine(content, `Underlying error: ${err.message}`, 'var(--frost)');
            } else {
                appendErrorLine(content, `Network Error: ${err.message}`, 'var(--error)');
            }
            
            document.getElementById('response-headers').textContent = 'N/A';
            document.getElementById('response-raw').textContent = err.stack || String(err);
        }

        // Safe multi-line error rendering: textContent only, never innerHTML
        // with user-influenced strings (URL, error messages).
        function appendErrorLine(container, text, color) {
            const line = document.createElement('span');
            line.style.display = 'block';
            line.style.color = color;
            line.textContent = text;
            container.appendChild(line);
        }

        function highlightJSON(json) {
            let str = JSON.stringify(json, null, 2);
            str = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return str.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function copyResponse() {
            const content = document.getElementById('response-content').innerText;
            navigator.clipboard.writeText(content).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerHTML = '<span class="icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
                setTimeout(() => {
                    btn.innerHTML = '<span class="icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
                }, 2000);
            });
        }

        function addToHistory(method, url) {
            history = history.filter(h => h.url !== url || h.method !== method);
            history.unshift({ 
                method, 
                url, 
                time: new Date().toLocaleTimeString(),
                timestamp: Date.now()
            });
            history = history.slice(0, 20);
            localStorage.setItem('api_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const mainList = document.getElementById('main-history-list');
            
            const html = history.length ? history.map(h => `
                <li class="history-item" onclick="loadHistory('${h.method}', '${h.url}')">
                    <span class="history-method ${h.method}">${h.method}</span>
                    <span class="history-url">${h.url}</span>
                    <span class="history-time">${h.time}</span>
                </li>
            `).join('') : `
                <li class="history-empty">No requests yet. Make your first request above.</li>
            `;
            
            mainList.innerHTML = html;
        }

        function loadHistory(method, url) {
            document.getElementById('method').value = method;
            document.getElementById('url').value = url;
            updateCorsBanner();
            switchTab('request', 'req-body-tab', document.querySelector('.tab'));
        }

        function clearHistory() {
            history = [];
            localStorage.setItem('api_history', '[]');
            renderHistory();
        }

        function getMethodColor(method) {
            const colors = {
                'GET': 'var(--method-get)',
                'POST': 'var(--method-post)',
                'PUT': 'var(--method-put)',
                'DELETE': 'var(--method-delete)',
                'PATCH': 'var(--method-patch)'
            };
            return colors[method] || 'var(--signal)';
        }
    </script>
</body>
</html>
